<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>우리의 추억</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="design-tokens.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="app" class="app-shell"></main>

    <template id="memory-card-template">
      <article class="memory-card">
        <div class="memory-cover"></div>
        <div class="memory-copy">
          <div class="memory-card-head">
            <h3></h3>
            <span class="author-badge"></span>
          </div>
          <p class="memory-meta"></p>
          <p class="memory-preview"></p>
        </div>
      </article>
    </template>

    <script src="script.js"></script>
  </body>
</html>
